name: PublishNuGet

# Releases ShimmerAPI and Shimmer32FeetAPI: Actions > PublishNuGet > Run workflow, on master.
# The version is the latest vX.Y.Z tag with the chosen part bumped. It is stamped into both
# projects at build time, so the <Version> in the csproj files and Shimmer32FeetAPI's
# AssemblyInfo.cs is only the default for local builds and is never bumped by hand.
# The build job packs both packages; the publish job pushes exactly those packages to nuget.org,
# then creates the tag and a GitHub release with generated notes. A release made by hand on
# GitHub publishes nothing. Recover a failed release with "Re-run failed jobs" on the same run,
# never a new Run workflow (see AGENTS.md).
# Uses nuget.org trusted publishing: no stored API key. The ShimmerEngineering profile on
# nuget.org holds a policy trusting this repo, this workflow file and the nuget-release
# environment, which only master may deploy to. Renaming the file or the environment means
# updating that policy.
# Pull requests that touch either package run the build job at the next patch version, with
# read-only permissions and no publish job.
#
# Hardware test gate: before releasing, run tools/hil/run-csharp-hil.ps1 -Report on the bench at the
# commit being released (see tools/hil/README.md). It posts the commit status "csharp-hil". A
# release stops before building unless that status passed for this commit, or hil_waiver gives a
# Jira key; the release notes say which.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Part of the latest vX.Y.Z tag to bump'
        type: choice
        options: [ patch, minor, major ]
        default: patch
      hil_waiver:
        description: 'Jira key to release without a passing hardware test (HIL), e.g. DEV-1234. Blank = require one'
        type: string
        default: ''
  pull_request:
    branches: [ master ]
    paths:
      - 'ShimmerAPI/ShimmerAPI/**'
      - 'Shimmer32FeetAPI/**'
      - 'license.md'
      - '.github/workflows/PublishNuGet.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:

    runs-on: windows-latest

    # statuses: the HIL gate reads the commit's "csharp-hil" status
    permissions:
      contents: read
      statuses: read

    env:
      PACKAGE_DIR: ${{ github.workspace }}\nupkg-out

    outputs:
      version: ${{ steps.version.outputs.version }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      hil: ${{ steps.hil.outputs.hil }}

    steps:
    - name: Check the release is from master
      if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master'
      run: |
        Write-Error "Releases are made from master. Run the workflow again with 'Use workflow from: master', not $env:GITHUB_REF_NAME."
        exit 1
    # Before any building, so a release without a hardware test fails in seconds.
    - name: Check the hardware test (HIL) result
      id: hil
      if: github.event_name == 'workflow_dispatch'
      env:
        GH_TOKEN: ${{ github.token }}
        WAIVER: ${{ inputs.hil_waiver }}
      run: |
        $context = 'csharp-hil'
        if ($env:WAIVER -and $env:WAIVER -cnotmatch '^[A-Z][A-Z0-9]+-[0-9]+$') {
          Write-Error "hil_waiver must be a Jira key such as DEV-1234, not '$env:WAIVER'."
          exit 1
        }
        # Newest first: the latest result for this context on this exact commit decides.
        $lines = @(gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA/statuses" --paginate --jq ".[] | select(.context == `"$context`") | [.state, .description] | @tsv")
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Could not read the commit statuses of $env:GITHUB_SHA."
          exit 1
        }
        $state, $description = if ($lines.Count -gt 0) { $lines[0] -split "`t", 2 } else { '', '' }
        if ($state -eq 'success') {
          "Hardware test passed on $env:GITHUB_SHA`: $description"
          "hil=Tested on hardware before release: $description." >> $env:GITHUB_OUTPUT
        } elseif ($env:WAIVER) {
          Write-Host "::warning::No passing '$context' on $env:GITHUB_SHA (found: $(if ($state) { $state } else { 'none' })); released under waiver $env:WAIVER."
          "hil=Released without a passing hardware test (HIL), waived under $env:WAIVER." >> $env:GITHUB_OUTPUT
        } else {
          $found = if ($state) { "$state`: $description" } else { 'none' }
          Write-Error "No passing '$context' on $env:GITHUB_SHA (found: $found). On the bench, at this commit, run: tools/hil/run-csharp-hil.ps1 -Report. Then run this workflow again, or give a Jira key in hil_waiver."
          exit 1
        }
    - uses: actions/checkout@v4
    - name: Work out the version
      id: version
      env:
        BUMP: ${{ inputs.bump || 'patch' }}
      run: |
        # Only vX.Y.Z tags: the repo also has BLE and REV tags in other formats.
        $versions = git ls-remote --tags --refs origin 'refs/tags/v*' |
          ForEach-Object { ($_ -split 'refs/tags/')[1] } |
          Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
          ForEach-Object { [version]$_.Substring(1) }
        if (-not $versions) {
          Write-Error 'No vX.Y.Z tag to bump from.'
          exit 1
        }
        $previous = $versions | Sort-Object | Select-Object -Last 1
        $version = switch ($env:BUMP) {
          'major' { "$($previous.Major + 1).0.0" }
          'minor' { "$($previous.Major).$($previous.Minor + 1).0" }
          default { "$($previous.Major).$($previous.Minor).$($previous.Build + 1)" }
        }
        "Previous release v$previous, this one v$version"
        "VERSION=$version" >> $env:GITHUB_ENV
        "version=$version" >> $env:GITHUB_OUTPUT
        "previous_tag=v$previous" >> $env:GITHUB_OUTPUT
    - name: Stamp the version into Shimmer32FeetAPI's AssemblyInfo
      run: |
        # A non-SDK project: -p:Version sets its package version but not its assembly version.
        $file = 'Shimmer32FeetAPI/Properties/AssemblyInfo.cs'
        $text = Get-Content $file -Raw
        foreach ($attribute in 'AssemblyVersion', 'AssemblyFileVersion') {
          $pattern = "(?m)^\[assembly: $attribute\(""[^""]*""\)\]"
          if ($text -notmatch $pattern) {
            Write-Error "No [assembly: $attribute(...)] line in $file to stamp."
            exit 1
          }
          $text = $text -replace $pattern, "[assembly: $attribute(""$env:VERSION.0"")]"
        }
        Set-Content $file $text -NoNewline -Encoding utf8BOM
    - name: Setup MSBuild Path
      uses: microsoft/setup-msbuild@v2
    - name: Build and pack ShimmerAPI
      run: msbuild ShimmerAPI/ShimmerAPI/ShimmerAPI.csproj -restore -p:Configuration=Release "-p:Version=$env:VERSION" "-p:PackageOutputPath=$env:PACKAGE_DIR"
    - name: Build and pack Shimmer32FeetAPI
      run: msbuild Shimmer32FeetAPI/Shimmer32FeetAPI.csproj -restore -p:Configuration=Release "-p:Version=$env:VERSION" "-p:PackageOutputPath=$env:PACKAGE_DIR"
    - name: Upload packages
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ${{ env.PACKAGE_DIR }}

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    needs: build

    runs-on: windows-latest

    # Only master may deploy to this environment, and the nuget.org policy only trusts tokens
    # minted in it, so no other branch can publish whatever its copy of this file says.
    environment: nuget-release

    permissions:
      contents: write
      id-token: write

    env:
      PACKAGE_DIR: ${{ github.workspace }}\nupkg-out
      VERSION: ${{ needs.build.outputs.version }}
      PREVIOUS_TAG: ${{ needs.build.outputs.previous_tag }}
      HIL: ${{ needs.build.outputs.hil }}

    steps:
    - name: Download packages
      uses: actions/download-artifact@v4
      with:
        name: nuget-packages
        path: ${{ env.PACKAGE_DIR }}
    - name: NuGet login
      id: login
      uses: NuGet/login@v1
      with:
        user: ShimmerEngineering
    - name: Push to nuget.org
      env:
        NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
      run: |
        # ShimmerAPI first: Shimmer32FeetAPI depends on this exact version of it.
        # --skip-duplicate makes "Re-run failed jobs" safe after a partial failure.
        foreach ($id in 'ShimmerAPI', 'Shimmer32FeetAPI') {
          dotnet nuget push "$env:PACKAGE_DIR\$id.$env:VERSION.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
    - name: Create the tag and GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        # Last, so a failed push leaves no tag behind.
        $notes = "NuGet: https://www.nuget.org/packages/ShimmerAPI/$env:VERSION and https://www.nuget.org/packages/Shimmer32FeetAPI/$env:VERSION"
        $notes += "`n`n$(if ($env:HIL) { $env:HIL } else { 'No hardware test result' })"
        gh release create "v$env:VERSION" --target $env:GITHUB_SHA --title "Shimmer C# API Rev $env:VERSION" --notes $notes --generate-notes --notes-start-tag $env:PREVIOUS_TAG
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
